name: Diya build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and Cloud
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json
      - run: npm ci
      - run: npm ci --prefix cloud
      - run: npm run check

  portable:
    name: Build portable Windows app
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json
      - run: npm ci
      - run: npm ci --prefix cloud
      - run: npm run dist
      - run: npm run submission:bundle
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diya-portable-Windows
          path: dist/Diya *.exe
          if-no-files-found: error
      - name: Upload hackathon submission bundle
        uses: actions/upload-artifact@v4
        with:
          name: Diya-hackathon-submission
          path: dist/submission/Diya-hackathon-submission.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME must match package version v$version." }
          gh release create $env:GITHUB_REF_NAME "dist/Diya $version.exe" "dist/submission/Diya-hackathon-submission.zip" --title "Diya $version" --generate-notes
