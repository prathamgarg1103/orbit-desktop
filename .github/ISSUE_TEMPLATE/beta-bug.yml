name: Diya beta bug
description: Report something that broke or felt wrong during the Diya beta.
title: "[Beta bug]: "
labels: ["beta", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Diya. Do not attach screenshots that contain private content unless you are comfortable sharing them in this repository.
  - type: input
    id: app
    attributes:
      label: App or workflow
      description: What app were you using when this happened?
      placeholder: "FL Studio, Claude Code, Notion, Gmail, browser dashboard..."
    validations:
      required: true
  - type: dropdown
    id: bucket
    attributes:
      label: Feedback bucket
      options:
        - "targeting: pointer or coordinates felt wrong"
        - "context: Diya misunderstood the screen"
        - "trust: unclear what Diya saw or would do"
        - "workflow: unclear when to invoke Diya"
        - "agent: Notion/Gmail action was not valuable or clear"
        - "voice: speech input failed or felt awkward"
        - other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Give the smallest steps that reproduce the issue.
      placeholder: "1. Pressed Ctrl+Shift+Space...\n2. Asked...\n3. Diya pointed at..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect Diya to do?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Diya version
      placeholder: "0.11.1"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include secrets, private tokens, or sensitive screen content in this report.
          required: true
