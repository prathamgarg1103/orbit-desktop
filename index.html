<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orbit Cursor Vision</title>
  <link rel="stylesheet" href="renderer.css">
</head>
<body>
  <main class="overlay" aria-live="polite">
    <div class="orb" aria-hidden="true"><span></span><span></span><i></i></div>
    <section class="card" id="card">
      <p class="eyebrow" id="eyebrow">ORBIT IS IDLE</p>
      <h1 id="title">Hover companion</h1>
      <p id="detail">Press <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>Space</kbd> to let Orbit explain what is under your cursor.</p>
      <p class="hint" id="hint">It is click-through and never blocks your mouse.</p>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
