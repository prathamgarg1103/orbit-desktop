<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orbit companion</title>
  <link rel="stylesheet" href="renderer.css">
</head>
<body>
  <main class="companion state-ready" id="companion">
    <div class="cursor-buddy" aria-hidden="true"><span></span><i></i></div>
    <section class="bubble">
      <div class="topline">
        <span class="live-dot"></span><span id="context-label">screen context ready</span>
        <button id="settings" class="quiet" aria-label="Connections">&#9881;</button>
        <button id="close" class="quiet" aria-label="Close">&times;</button>
      </div>

      <p class="hover-line" id="hover-line">Point at anything. Orbit keeps the screen private until you use the hotkey.</p>

      <nav class="modes" aria-label="Mode">
        <button class="mode active" data-mode="coach">ask</button>
        <button class="mode" data-mode="agent">agent</button>
      </nav>

      <div class="composer">
        <input id="prompt" autocomplete="off" placeholder="ask about what is here" aria-label="Ask Orbit">
        <button id="voice" class="round" title="Speak">&#9673;</button>
        <button id="ask" class="send" title="Ask Orbit">&#8594;</button>
      </div>
      <p class="hint" id="hint"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>Space</kbd> capture &middot; Orbit follows while active</p>

      <section id="answer" class="answer" hidden aria-live="polite">
        <div class="answer-label" id="answer-mode">orbit</div>
        <p id="answer-text"></p>
        <div class="answer-actions">
          <button id="draw" class="soft">guide me</button>
          <button id="again" class="soft">ask again</button>
        </div>
        <section id="agent-action" class="agent-action" hidden>
          <p id="agent-action-detail"></p>
          <button id="approve-agent" class="approve"></button>
        </section>
      </section>

      <section id="connections" class="connections" hidden>
        <div class="connection-head"><strong>connections</strong><button id="close-settings" class="quiet">&times;</button></div>
        <p>Cloud keeps model and connector secrets server-side. Agents always wait for approval.</p>
        <div id="connector-row" class="connector-row"></div>
        <div id="connector-form" class="connector-form" hidden>
          <label id="connector-title">Access token<input id="connector-token" type="password" autocomplete="off"></label>
          <label id="cloud-url-row" hidden>Orbit Cloud URL<input id="cloud-url" type="url" autocomplete="url" placeholder="https://cloud.example.com"></label>
          <label id="notion-parent-row" hidden>Notion parent page ID<input id="notion-parent" type="text" autocomplete="off"></label>
          <div><button id="save-connector" class="approve">save</button><button id="disconnect-connector" class="quiet" hidden>disconnect</button></div>
        </div>
      </section>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
